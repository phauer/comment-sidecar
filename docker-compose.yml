services:
  apache_with_php:
    build: .
    volumes:
      - ./src:/var/www/html/
    ports:
      - "80:80"
  mysql:
    image: mariadb:10.11
    volumes:
      #execute the contained sql files on startup
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_DATABASE: "comment-sidecar"
  mailhog:
      image: mailhog/mailhog:v1.0.0
      platform: linux/amd64
      ports:
        - "1025:1025"
        - "8025:8025"