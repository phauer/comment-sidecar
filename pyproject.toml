[project]
name = "comment-sidecar-tests"
version = "0.1.0"
description = "Integration tests and import script for comment-sidecar"
authors = [{ name = "Philipp Hauer" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "requests>=2.32,<3",
    "path.py>=12.5.0,<13",
    "python-dateutil>=2.9,<3",
    "assertpy>=1.1,<2",
    "mysql-connector-python>=9.0,<10",
    "click>=8.1,<9",
]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.uv]
package = false
